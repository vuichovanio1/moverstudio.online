<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f0e8"/>
      <stop offset="100%" stop-color="#ebe2d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d8d2c7" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f3eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.42"/>

  <!-- Outer border -->
  <rect x="56" y="56" width="1088" height="518" fill="none" stroke="#1a1e22" stroke-width="4"/>

  <!-- Decorative accent lines on outer border -->
  <path d="M 56 124 H 250" stroke="#8f4722" stroke-width="3" opacity="0.8"/>
  <path d="M 56 506 H 258" stroke="#8f4722" stroke-width="3" opacity="0.8"/>

  <!-- Left panel -->
  <rect x="84" y="84" width="272" height="462" fill="url(#panel)" stroke="#1a1e22" stroke-width="2"/>
  <path d="M 110 135 H 234" stroke="#8f4722" stroke-width="2.5" opacity="0.85"/>
  <path d="M 110 504 H 234" stroke="#8f4722" stroke-width="2.5" opacity="0.85"/>

  <!-- M logo box -->
  <rect x="112" y="174" width="216" height="216" fill="#f4f0e8" stroke="#1a1e22" stroke-width="2"/>

  <!-- Clean M - no dot, properly centered and sized -->
  <text x="220" y="338" text-anchor="middle" dominant-baseline="auto"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="148" font-weight="700" fill="#1a1e22"
        letter-spacing="-4">M</text>

  <!-- Panel bottom text -->
  <text x="220" y="438" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1e22">MOVER Studio</text>
  <text x="220" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1e22" opacity="0.75">Бързи HTML сайтове</text>
  <text x="220" y="494" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8f4722" opacity="0.85">без WordPress</text>

  <!-- Right content - headline -->
  <text x="404" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#1a1e22" letter-spacing="-0.7">Изработка на сайт</text>
  <text x="404" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#8f4722">без WordPress, с ясен дизайн</text>
  <text x="404" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1a1e22" opacity="0.88">Под 1 секунда. Силна SEO основа. Лек код.</text>

  <!-- Badges -->
  <rect x="404" y="348" width="162" height="40" fill="#8f4722" opacity="0.12" stroke="#8f4722" stroke-width="1.2"/>
  <text x="485" y="373" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1e22">100 PageSpeed</text>

  <rect x="578" y="348" width="148" height="40" fill="#ffffff" stroke="#1a1e22" stroke-width="1.2"/>
  <text x="652" y="373" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1e22">Static HTML</text>

  <rect x="738" y="348" width="186" height="40" fill="#ffffff" stroke="#1a1e22" stroke-width="1.2"/>
  <text x="831" y="373" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1e22">Без месечни такси</text>

  <!-- Bottom quote box - wider to prevent overflow -->
  <rect x="404" y="430" width="696" height="96" fill="#ffffff" stroke="#1a1e22" stroke-width="2"/>
  <text x="428" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1a1e22">Сайтове, които изглеждат модерно</text>
  <text x="428" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1a1e22">и се зареждат бързо.</text>
  <text x="428" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#8f4722">MOVER Studio · moverstudio.online · от 400€</text>
</svg>
