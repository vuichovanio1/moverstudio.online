/* TECHNICAL ANNOTATIONS & DIMENSION LINES */
section,
article,
.blueprint-wrap,
.hero,
.calculator,
.result-box {
  position: relative;
}

section::before,
article::before,
.blueprint-wrap::before,
.hero::before,
.calculator::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--brand) 0%, transparent 100%);
  opacity: 0.3;
  pointer-events: none;
}

/* Technical annotation corners */
section::after,
article::after,
.blueprint-wrap::after {
  content: '';
  position: absolute;
  width: 15px;
  height: 15px;
  border-left: 1px solid var(--brand);
  border-top: 1px solid var(--brand);
  top: -1px;
  left: -1px;
  opacity: 0.5;
  pointer-events: none;
}

/* Metadata labels in corners */
.technical-drawing::before {
  content: 'SYSTEM: HTML5 | CORE: STATIC | SPEED: MAX';
  position: absolute;
  font-size: 0.55rem;
  color: var(--brand);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  top: -1.8rem;
  left: 0;
  opacity: 0.6;
  font-family: var(--mono);
  pointer-events: none;
}

/* Dimension lines on hover */
.blueprint-wrap:hover::before {
  opacity: 0.6;
  background: linear-gradient(90deg, var(--brand) 0%, var(--brand) 50%, transparent 100%);
  transition: opacity 0.3s ease, background 0.3s ease;
}

.calculator:hover::before {
  opacity: 0.5;
  background: linear-gradient(90deg, var(--brand) 0%, transparent 60%);
  transition: opacity 0.3s ease;
}
